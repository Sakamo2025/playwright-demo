name: Playwright CI

on:
  push:
    branches: [ main, temp-fix-branch ]
  pull_request:
    branches: [ main, temp-fix-branch ]

  schedule:
    - cron: '30 8 * * *'  # 17:30 JST
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. ソース取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 3. 依存関係インストール
      - name: Install dependencies
        run: npm ci

      # 4. Playwright ブラウザインストール
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. storage フォルダ作成
      - name: Prepare storage folder
        run: mkdir -p storage

      # 6. Secrets から storageState を復元
      - name: Restore storageState
        run: |
          mkdir -p storage
          echo "$AUTH_JSON_BASE64" | base64 --decode > storage/auth.json
        env:
          AUTH_JSON_BASE64: ${{ secrets.AUTH_JSON_BASE64 }}

      # 7. 通常テスト実行
      - name: Run Playwright tests
        run: npx playwright test tests/** --project=chromium --grep "@setup"
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}

      # 8. HTML レポートアップロード
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report