name: Playwright CI

on:
  push:
    branches: [ main, temp-fix-branch ]
  pull_request:
    branches: [ main, temp-fix-branch ]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. ソース取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 3. 依存関係インストール
      - name: Install dependencies
        run: npm ci

      # 4. Playwright ブラウザインストール
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. storage フォルダ作成
      - name: Prepare storage folder
        run: mkdir -p storage

      # 6. storageState を生成（自動ログイン）
      - name: Generate storage state
        run: |
          npx playwright test tests/login.spec.ts --project=chromium --headed
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}

      # 7. テスト実行（storageState を使用）
      - name: Run Playwright tests
        run: xvfb-run npx playwright test tests/login.spec.ts --project=chromium --headed
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}

      # 8. HTML レポートアップロード
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report