name: Playwright CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACTIONS_STEP_DEBUG: true  # デバッグログ最大化

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. ソース取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js セットアップ + npm キャッシュ削除
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
           node-version: 20
           # cache: "npm"

      # 3. Node.js と npm 情報確認
      - name: Node and npm info
        run: |
          node -v | tee node_version.txt
          npm -v | tee npm_version.txt
          npm list playwright 2>&1 | tee playwright_list.txt || echo "playwright not installed"
          npm list @playwright/test 2>&1 | tee playwright_test_list.txt || echo "@playwright/test not installed"

      # 4. 古いモジュールとキャッシュ削除
      - name: Clean old modules and cache
        run: |
          rm -rf ./my-playwright/node_modules
          rm -rf ./my-playwright/.playwright
          rm -rf ./my-playwright/playwright-report
          rm -f ./my-playwright/package-lock.json
          npm cache verify | tee npm_cache_verify.txt

      # 5. Playwright インストール + 依存確認
      - name: Install Playwright
        working-directory: ./my-playwright
        run: |
          npm install playwright@1.46.2 @playwright/test@1.46.2 | tee npm_install_log.txt
          npx playwright install --with-deps | tee playwright_install_log.txt
          ls -R node_modules/playwright-core/lib/server/recorder | tee recorder_files.txt

      # 6. モジュールロード確認
      - name: Check Playwright modules
        working-directory: ./my-playwright
        run: |
          node -e "require('playwright'); console.log('playwright loaded')" 2>&1 | tee module_load_playwright.txt
          node -e "require('@playwright/test'); console.log('@playwright/test loaded')" 2>&1 | tee module_load_test.txt

      # 7. Playwright テスト実行（詳細ログ付き）
      - name: Run Playwright tests
        working-directory: ./my-playwright
        run: |
          npx playwright test --reporter=html --verbose 2>&1 | tee playwright_test_log.txt
