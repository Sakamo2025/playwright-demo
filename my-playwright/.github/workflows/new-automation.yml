name: Playwright CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. ソース取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js セットアップ + npm キャッシュ削除
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
           node-version: 20
           cache: "npm" # npm キャッシュ利用

      # 3. npm キャッシュ破損対策（重要）
      - name: Clean npm cache
        run: npm cache clean --force

      # 4. 依存関係の完全クリーンインストール
      - name: Clean and install dependencies
        working-directory: ./my-playwright
        run: |
          rm -rf node_modules
          rm -rf .playwright
          rm -rf playwright-report
          rm -f package-lock.json
          npm install playwright@1.46.2 @playwright/test@1.46.2

      # 4.5 Playwright ブラウザインストール
      - name: Install Playwright browsers
        working-directory: ./my-playwright
        run: npx playwright install --with-deps

      # 5. Playwright テスト実行
      - name: Run Playwright tests
        working-directory: ./my-playwright
        run: npx playwright test --reporter=html
