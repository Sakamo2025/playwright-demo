# yaml-language-server: disable
name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # クリーン・依存関係再インストール（テスト前）
      - name: Clean and install dependencies
        run: |
          rm -rf node_modules
          rm -rf playwright-report
          rm -rf .playwright
          rm -f package-lock.json   # ← 追加
          npm install               # ← npm ci ではなく install

      # Playwright 用ブラウザをインストール
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 認証ストレージ生成
      - name: Setup authentication storage
        run: npx playwright test tests/setup-auth.ts --project=chromium
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

      # メインテスト実行
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --reporter=html
        env:
          CI: true

      # HTML レポートアップロード
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./playwright-report
          if-no-files-found: ignore
