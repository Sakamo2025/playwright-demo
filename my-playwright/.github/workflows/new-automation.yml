# yaml-language-server: disable
name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ソースコード取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 依存パッケージのインストール
      - name: Install dependencies
        run: npm ci

      # Playwright用ブラウザをインストール
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 1️⃣ 認証ストレージを生成
      - name: Setup authentication storage
        run: npx playwright test tests/setup-auth.ts --project=chromium
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

      # 2️⃣ 認証済みストレージを使ってメインテスト実行
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --reporter=html
        env:
          CI: true

      # 3️⃣ HTMLレポートアップロード（成功・失敗に関わらず実行）
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

